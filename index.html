<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Form</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="scene">
    <div class="hero-panel">
      <div class="hero-content">
        <span class="eyebrow">Welcome back</span>
        <h1>Login to Spheronix</h1>
        <p>One secure place for access, analytics, and growth. Sign in and explore the next-gen dashboard experience.</p>
        <div class="stats-grid">
          <div class="stat-card">
            <strong>24/7</strong>
            <span>Support</span>
          </div>
          <div class="stat-card">
            <strong>99.9%</strong>
            <span>Uptime</span>
          </div>
          <div class="stat-card">
            <strong>Secure</strong>
            <span>Login</span>
          </div>
        </div>
      </div>
      <div class="hero-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
      </div>
    </div>

    <main class="login-page">
      <section class="login-card glass-card">
        <div class="top-bar">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="card-header">
          <h2>Sign In</h2>
          <p>Secure access to your Spheronix workspace.</p>
        </div>
        <form id="loginForm" class="login-form" novalidate>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
          <span class="error" id="emailError"></span>

          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required minlength="6" />
          <span class="error" id="passwordError"></span>

          <button type="submit" class="submit-button">Login</button>
        </form>
        <div class="extra-row">
          <p>Don’t have an account? <a href="#">Create one</a></p>
          <span class="separator" aria-hidden="true">|</span>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
